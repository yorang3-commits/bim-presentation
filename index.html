<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIM 논문 발표 일정</title>
<style>
:root {
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#202532;
  --muted:#737b8c;
  --line:#e6e9f0;
  --accent:#2f4fbe;
  --accent-soft:#eef2ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter, Pretendard, "Noto Sans KR", Arial, sans-serif;
}
.wrap {
  max-width:820px;
  margin:48px auto;
  padding:0 18px 60px;
}
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:28px;
  box-shadow:0 14px 34px rgba(31,41,55,.06);
}
.eyebrow {
  color:var(--accent);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:8px;
}
h1 {
  margin:0;
  font-size:30px;
  letter-spacing:-.03em;
}
.desc {
  color:var(--muted);
  line-height:1.7;
  margin:10px 0 24px;
  font-size:14px;
}
.summary {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
.pill {
  background:var(--accent-soft);
  color:var(--accent);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
table {
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
}
th, td {
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  text-align:left;
}
th {
  background:#f9faff;
  font-size:12px;
  color:#5e6677;
}
td {
  font-size:14px;
}
td:first-child {
  width:120px;
  font-weight:800;
  color:#334155;
}
tr:last-child td {
  border-bottom:0;
}
.footer {
  margin-top:18px;
  color:#9aa1ad;
  font-size:11px;
  text-align:center;
}
@media(max-width:640px) {
  .wrap { margin:20px auto; padding:0 10px 36px; }
  .card { padding:20px 16px; border-radius:18px; }
  h1 { font-size:24px; }
  th, td { padding:12px 10px; }
  td:first-child { width:90px; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">KAIST BIM · 2026 FALL</div>
      <h1>논문 발표 일정</h1>
      <div class="desc">
        희망 발표일을 최대한 반영하고, 중복 및 미응답 인원은 랜덤으로 배정한 최종 일정입니다.
      </div>

      <div class="summary">
        <span class="pill">총 17명</span>
        <span class="pill">발표 15분 이내</span>
        <span class="pill">최종 확정</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>발표일</th>
            <th>발표자</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>9/10</td><td>김선욱</td></tr>
<tr><td>9/17</td><td>김지은 · 박은서</td></tr>
<tr><td>9/24</td><td>안세진</td></tr>
<tr><td>10/1</td><td>김예랑</td></tr>
<tr><td>10/8</td><td>강은지 · 이승원</td></tr>
<tr><td>10/15</td><td>김지연</td></tr>
<tr><td>10/29</td><td>이지호 · 김택우</td></tr>
<tr><td>11/5</td><td>홍근형</td></tr>
<tr><td>11/12</td><td>이지민 · 안정혁</td></tr>
<tr><td>11/19</td><td>우재욱</td></tr>
<tr><td>11/26</td><td>최웅선</td></tr>
<tr><td>12/3</td><td>김승환</td></tr>
<tr><td>12/10</td><td>김민준</td></tr>
        </tbody>
      </table>

      <div class="footer">Course presentation schedule · maintained by TA</div>
    </div>
  </div>
</body>
</html>

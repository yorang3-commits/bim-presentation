<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIM 발표일 공통 랜덤 배정</title>
<style>
:root{
  --bg:#f7f8fc; --card:#fff; --text:#202532; --muted:#70788a;
  --line:#e4e7ef; --accent:#3557d6; --soft:#eef1ff; --good:#287a55;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}
.wrap{max-width:920px;margin:36px auto;padding:0 18px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 10px 28px rgba(31,41,70,.05)}
h1{margin:0 0 8px;font-size:28px}
h2{margin:0 0 14px;font-size:18px}
p{margin:0;color:var(--muted);line-height:1.65}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700}
.pill.good{background:#eaf7ef;color:var(--good)}
button{border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;margin-right:8px}
.primary{background:var(--accent);color:#fff}
.secondary{background:#fff;color:var(--accent);border:1px solid #ccd4f6}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{background:#fafbfe;color:#596172;font-size:12px}
.note{background:#eef7ff;border:1px solid #cfdef8;color:#35506f;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.6}
#log{white-space:pre-wrap;background:#111827;color:#dce5f3;padding:14px;border-radius:12px;font-size:12px;line-height:1.6}
.hidden{display:none}
.small{font-size:12px;color:var(--muted)}
@media(max-width:640px){
  .wrap{margin:20px auto;padding:0 10px 36px}
  .card{padding:18px 14px}
  h1{font-size:23px}
  button{width:100%;margin:0 0 8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>BIM 논문 발표일 랜덤 배정</h1>
    <p>제출된 희망일은 최대한 반영하고, 중복 및 미응답 인원은 랜덤으로 배정합니다.</p>
    <div class="meta">
      <span class="pill">9/10 김선욱 고정</span>
      <span class="pill">2인 발표: 9/17 · 10/8 · 10/29 · 11/12</span>
      <span class="pill good">총 17명</span>
    </div>
  </div>

  <div class="card">
    <div class="note">
      희망일이 겹친 경우 해당 날짜의 정원만 랜덤으로 선정하며,
      미배정 인원과 미응답자는 남은 날짜에 랜덤 배정합니다.
    </div>
    <div style="margin-top:16px">
      <button class="primary" onclick="showResult()">🎲 랜덤 결과 보기</button>
      <button class="secondary" onclick="copyResult()">📋 결과 복사</button>
    </div>
  </div>

  <div class="card">
    <h2>최종 발표 일정</h2>
    <div id="result" class="small">위 버튼을 누르면 최종 배정 결과가 표시됩니다.</div>
  </div>

  <div class="card">
    <h2>배정 로그</h2>
    <div id="log">위 버튼을 누르면 배정 과정이 표시됩니다.</div>
  </div>
</div>

<script>
const schedule = [
  {date:'9/10',names:'김선욱'},
{date:'9/17',names:'김지은 · 박은서'},
{date:'9/24',names:'안세진'},
{date:'10/1',names:'김예랑'},
{date:'10/8',names:'강은지 · 이승원'},
{date:'10/15',names:'김지연'},
{date:'10/29',names:'이지호 · 김택우'},
{date:'11/5',names:'홍근형'},
{date:'11/12',names:'이지민 · 안정혁'},
{date:'11/19',names:'우재욱'},
{date:'11/26',names:'최웅선'},
{date:'12/3',names:'김승환'},
{date:'12/10',names:'김민준'}
];

const logs = [
  '[고정] 김선욱 → 9/10',
'[희망 반영] 김지은 → 9/17',
'[희망 반영] 박은서 → 9/17',
'[희망 반영] 김예랑 → 10/1',
'[10/8 중복 랜덤 선정] 강은지 → 10/8',
'[10/8 중복 랜덤 선정] 이승원 → 10/8',
'[재배정 대상] 김지연 (원희망 10/8)',
'[희망 반영] 이지호 → 10/29',
'[희망 반영] 김택우 → 10/29',
'[희망 반영] 홍근형 → 11/5',
'[희망 반영] 이지민 → 11/12',
'[희망 반영] 안정혁 → 11/12',
'[희망 반영] 김승환 → 12/3',
'[랜덤 배정] 안세진 → 9/24',
'[랜덤 재배정] 김지연 → 10/15',
'[랜덤 배정] 우재욱 → 11/19',
'[랜덤 배정] 최웅선 → 11/26',
'[랜덤 배정] 김민준 → 12/10'
];

let shown = false;

function showResult(){
  let h = "<table><thead><tr><th>날짜</th><th>발표자</th></tr></thead><tbody>";
  schedule.forEach(x => {
    h += `<tr><td><b>${x.date}</b></td><td>${x.names}</td></tr>`;
  });
  h += "</tbody></table>";
  document.getElementById("result").innerHTML = h;
  document.getElementById("log").textContent = logs.join("\n");
  shown = true;
}

async function copyResult(){
  if(!shown) showResult();
  const text = "[BIM 논문 발표 일정]\n" +
    schedule.map(x => `${x.date}  ${x.names.replaceAll(" · ", ", ")}`).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    alert("결과를 복사했습니다.");
  } catch(e) {
    alert(text);
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIM 발표일 공통 랜덤 배정기</title>
<style>
:root{
  --bg:#f7f8fc; --card:#fff; --text:#202532; --muted:#70788a;
  --line:#e4e7ef; --accent:#3557d6; --soft:#eef1ff; --good:#287a55;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}
.wrap{max-width:920px;margin:36px auto;padding:0 18px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 10px 28px rgba(31,41,70,.05)}
h1{margin:0 0 8px;font-size:28px}
h2{margin:0 0 14px;font-size:18px}
p{margin:0;color:var(--muted);line-height:1.65}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700}
.pill.good{background:#eaf7ef;color:var(--good)}
button{border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;margin-right:8px}
.primary{background:var(--accent);color:#fff}
.secondary{background:#fff;color:var(--accent);border:1px solid #ccd4f6}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{background:#fafbfe;color:#596172;font-size:12px}
.note{background:#eef7ff;border:1px solid #cfdef8;color:#35506f;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.6}
#log{white-space:pre-wrap;background:#111827;color:#dce5f3;padding:14px;border-radius:12px;font-size:12px;line-height:1.6}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>BIM 논문 발표일 공통 랜덤 배정기</h1>
    <p>
      제출된 희망일은 최대한 반영하고, 중복 및 미응답 인원은 랜덤으로 배정합니다.
    </p>
    <div class="meta">
      <span class="pill">9/10 김선욱 고정</span>
      <span class="pill">2인 발표: 9/17 · 10/8 · 10/29 · 11/12</span>
    </div>
  </div>

  <div class="card">
    <div class="note">
      희망일은 최대한 그대로 반영합니다.<br>
      10/8 희망자 3명 중 2명은 동일한 랜덤 규칙으로 선정되고,
      나머지 1명과 미응답자 4명은 빈 날짜에 동일한 방식으로 배정됩니다.
    </div>
    <div style="margin-top:16px">
      <button class="primary" onclick="assign()">🎲 공통 랜덤 결과 보기</button>
      <button class="secondary" onclick="copyResult()">📋 결과 복사</button>
    </div>
  </div>

  <div class="card">
    <h2>최종 발표 일정</h2>
    <div id="result">버튼을 누르면 공통 결과가 표시됩니다.</div>
  </div>

  <div class="card">
    <h2>배정 로그</h2>
    <div id="log">버튼을 눌러주세요.</div>
  </div>
</div>

<script>
const SEED_TEXT = "BIM-2026-0905";

const dates=["9/10","9/17","9/24","10/1","10/8","10/15","10/29","11/5","11/12","11/19","11/26","12/3","12/10"];

const caps={
  "9/10":1,"9/17":2,"9/24":1,"10/1":1,"10/8":2,"10/15":1,
  "10/29":2,"11/5":1,"11/12":2,"11/19":1,"11/26":1,"12/3":1,"12/10":1
};

const people=[
  {name:"김선욱",pref:"9/10",fixed:true},
  {name:"김지은",pref:"9/17"},
  {name:"박은서",pref:"9/17"},
  {name:"김예랑",pref:"10/1"},
  {name:"김지연",pref:"10/8"},
  {name:"이승원",pref:"10/8"},
  {name:"강은지",pref:"10/8"},
  {name:"이지호",pref:"10/29"},
  {name:"김택우",pref:"10/29"},
  {name:"홍근형",pref:"11/5"},
  {name:"이지민",pref:"11/12"},
  {name:"안정혁",pref:"11/12"},
  {name:"김승환",pref:"12/3"},
  {name:"김민준",pref:""},
  {name:"최웅선",pref:""},
  {name:"안세진",pref:""},
  {name:"우재욱",pref:""}
];

let latest=null;

// String -> 32-bit integer hash
function hashString(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Deterministic PRNG
function mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}

function seededShuffle(arr, rng){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function assign(){
  const rng = mulberry32(hashString(SEED_TEXT));
  const result={}; dates.forEach(d=>result[d]=[]);
  const logs=[];
  const used=new Set();

  // 1) fixed
  people.filter(p=>p.fixed).forEach(p=>{
    result[p.pref].push(p.name);
    used.add(p.name);
    logs.push(`[고정] ${p.name} → ${p.pref}`);
  });

  // 2) preferences
  for(const d of dates){
    const candidates=people.filter(p=>!used.has(p.name) && p.pref===d);
    const remain=caps[d]-result[d].length;

    if(candidates.length<=remain){
      candidates.forEach(p=>{
        result[d].push(p.name);
        used.add(p.name);
        logs.push(`[희망 반영] ${p.name} → ${d}`);
      });
    }else{
      const shuffled=seededShuffle(candidates, rng);
      const winners=shuffled.slice(0,remain);
      const losers=shuffled.slice(remain);

      winners.forEach(p=>{
        result[d].push(p.name);
        used.add(p.name);
        logs.push(`[초과희망 공통랜덤 당첨] ${p.name} → ${d}`);
      });

      losers.forEach(p=>{
        logs.push(`[재배정 대상] ${p.name} (원희망 ${d})`);
      });
    }
  }

  // 3) remaining people
  const remainPeople=seededShuffle(people.filter(p=>!used.has(p.name)), rng);

  // 4) remaining slots
  let slots=[];
  dates.forEach(d=>{
    for(let i=result[d].length;i<caps[d];i++) slots.push(d);
  });
  slots=seededShuffle(slots, rng);

  remainPeople.forEach((p,i)=>{
    result[slots[i]].push(p.name);
    logs.push(`[공통랜덤 배정] ${p.name} → ${slots[i]}${p.pref?` (원희망 ${p.pref})`:""}`);
  });

  latest=result;
  render(result);
  document.getElementById("log").textContent=
    `추첨 코드: ${SEED_TEXT}\n\n` + logs.join("\n");
}

function render(result){
  let h="<table><thead><tr><th>날짜</th><th>발표자</th></tr></thead><tbody>";
  dates.forEach(d=>{
    h+=`<tr><td><b>${d}</b></td><td>${result[d].join(" · ")}</td></tr>`;
  });
  h+="</tbody></table>";
  document.getElementById("result").innerHTML=h;
}

function resultText(){
  if(!latest)return "";
  return "[BIM 논문 발표 일정]\n"+
    dates.map(d=>`${d}  ${latest[d].join(", ")}`).join("\n");
}

async function copyResult(){
  if(!latest){
    alert("먼저 공통 랜덤 결과를 확인해주세요.");
    return;
  }
  await navigator.clipboard.writeText(resultText());
  alert("결과를 복사했습니다.");
}
</script>
</body>
</html>
